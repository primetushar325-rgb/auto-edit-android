name: Build Debug APK

permissions:
  contents: write

on:
  push:
    branches: [ "arena/01a095d3-auto-edit-android", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests + Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoedit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish installable APK to apk-build branch
        if: success()
        run: |
          set -euo pipefail
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_SRC"
          cp "$APK_SRC" /tmp/app-debug.apk
          SHA_SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"
          OUT_NAME="AutoEdit-debug-${SHA_SHORT}.apk"
          LATEST="AutoEdit-latest-debug.apk"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin apk-build 2>/dev/null || true
          git checkout --orphan apk-build-temp
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/app-debug.apk "./$OUT_NAME"
          cp /tmp/app-debug.apk "./$LATEST"
          {
            echo "# AutoEdit Debug APK"
            echo
            echo "Built from \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`."
            echo
            echo "## Download"
            echo
            echo "- **Latest:** https://github.com/${{ github.repository }}/raw/apk-build/$LATEST"
            echo "- **This build:** https://github.com/${{ github.repository }}/raw/apk-build/$OUT_NAME"
            echo
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > README.md
          git add "$OUT_NAME" "$LATEST" README.md
          git commit -m "apk: AutoEdit debug ${SHA_SHORT} run ${{ github.run_id }}"
          git push -f origin HEAD:apk-build

      - name: Create/update prerelease with APK
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"
          TAG="apk-debug-zip-batch"
          TITLE="AutoEdit Debug — ZIP Batch + Home Scroll"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          # Delete existing prerelease/tag if present, then recreate with fresh APK
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK" \
            --prerelease \
            --title "$TITLE" \
            --notes "$(cat <<EOF
          ## AutoEdit debug build
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Features: ZIP serial batch import + home project scroll fix
          - ExportService unchanged

          ### Install
          Download \`app-debug.apk\` below (debug-signed, sideload OK).
          EOF
          )"
