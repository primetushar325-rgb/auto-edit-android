name: Build Debug APK

permissions:
  contents: write

on:
  push:
    branches: [ "arena/01a08bb2-auto-edit-android", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autoedit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Commit APK to branch apk-build
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/app-debug.apk
          ls -lh /tmp/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin apk-build || true
          git checkout --orphan apk-build-temp
          git rm -rf . || true
          cp /tmp/app-debug.apk ./AutoEdit-v1.8-debug.apk
          echo "# AutoEdit Debug APK" > README.md
          echo "Built from ${{ github.sha }} on $(date -u)" >> README.md
          git add AutoEdit-v1.8-debug.apk README.md
          git commit -m "apk: AutoEdit debug ${{ github.sha }} run ${{ github.run_id }}"
          git push -f origin HEAD:apk-build
